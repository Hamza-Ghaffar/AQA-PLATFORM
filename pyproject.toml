[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aqa-platform"
version = "0.1.0"
description = "Automated Quality Assurance Platform"
authors = [{name = "Hamza Ghaffar", email = "hamza.ghaffa.edu@gmail.com"}]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/hamza-ghaffar/aqa-platform"
Repository = "https://github.com/hamza-ghaffar/aqa-platform.git"
Issues = "https://github.com/hamza-ghaffar/aqa-platform/issues"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
managed = true
preview = false
